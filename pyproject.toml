[project]
name = "metriclayer"
version = "1.0.0"
description = "A semantic metrics layer for a synthetic marketplace: metrics defined once in YAML, compiled to fan-out-safe SQL on DuckDB, with a governed natural language interface, caching, and a FastAPI service."
readme = "README.md"
license = "MIT"
authors = [{ name = "Nick Bitzis" }]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyyaml>=6",
]

[project.optional-dependencies]
claude = ["anthropic>=2.6"]

[project.scripts]
metriclayer = "metriclayer.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metriclayer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
