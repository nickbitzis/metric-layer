name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint
        run: uvx ruff check .
      - name: Test
        run: uv run --python 3.12 --group dev pytest -q

  correctness:
    # Compiled metrics vs hand-written reference SQL (fails the build on any mismatch), the naive join
    # comparison, and the natural language eval. Tables go to the job summary.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build the warehouse
        run: uv run --python 3.12 metriclayer build
      - name: Reference SQL suite
        run: uv run --python 3.12 metriclayer verify --summary "$GITHUB_STEP_SUMMARY"
      - name: Natural language eval
        run: uv run --python 3.12 metriclayer nl-eval --summary "$GITHUB_STEP_SUMMARY"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t metric-layer:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name ml -p 8840:8840 -e METRICLAYER_ORDERS=3000 metric-layer:ci
          for i in $(seq 1 60); do curl -sf http://localhost:8840/healthz && break; sleep 2; done
          curl -sf http://localhost:8840/healthz
          curl -sf -X POST http://localhost:8840/api/query -H 'content-type: application/json' \
            -d '{"metrics":["net_revenue"],"grain":"month"}' > /dev/null
          curl -sf -X POST http://localhost:8840/api/ask -H 'content-type: application/json' \
            -d '{"question":"conversion rate by traffic source"}' | grep -q conversion_rate
          curl -sf http://localhost:8840/metrics | grep metriclayer_metrics_defined
          docker logs ml | tail -5
          docker rm -f ml
